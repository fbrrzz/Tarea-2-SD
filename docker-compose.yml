version: "3.9"

services:
  # ─── Zookeeper (Coordinador) ──────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ─── Kafka (Modo Zookeeper - Imagen Confluent) ───────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:

      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── Redis (caché) ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  # ─── Generador de Respuestas ──────────────────────────────────────────────────
  response_generator:
    build: ./response_generator
    container_name: response_generator
    environment:
      PORT: 8000
      FAILURE_RATE: "0.0"
    ports:
      - "8000:8000"

  # ─── Sistema de Métricas ──────────────────────────────────────────────────────
  metrics:
    build: ./metrics
    container_name: metrics
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Consumidores Kafka ─────────────────────────────────────────────────────
  consumer:
    build: ./consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      RESPONSE_GENERATOR_URL: http://response_generator:8000
      METRICS_URL: http://metrics:8080
      MAX_RETRIES: "3"
      CONSUMER_GROUP: geo-consumers
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      response_generator:
        condition: service_started
      metrics:
        condition: service_started
    deploy:
      replicas: 1

  # ─── Generador de Tráfico ─────────────────────────────────────────────────────
  producer:
    build: ./producer
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      QUERIES_PER_SECOND: "10"
      DISTRIBUTION: zipf
      DURATION_SECONDS: "60"
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started